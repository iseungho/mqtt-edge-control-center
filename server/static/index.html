<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MQTT Edge Control Center</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">LOCAL EDGE FLEET</p>
          <h1>MQTT Control Center</h1>
          <p class="description">Docker 엣지 에이전트의 Heartbeat와 시스템 사용량을 실시간으로 확인합니다.</p>
        </div>
        <div class="connection" id="connection" role="status">서버 연결 확인 중</div>
      </header>

      <section class="summary" aria-label="에이전트 요약">
        <article>
          <span>전체 에이전트</span>
          <strong id="total-count">0</strong>
        </article>
        <article>
          <span>온라인</span>
          <strong id="online-count">0</strong>
        </article>
        <article>
          <span>Disk 경고</span>
          <strong id="warning-count">0</strong>
        </article>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2>Agent Status</h2>
            <p>Heartbeat 30초 미수신 시 OFFLINE으로 전환됩니다.</p>
          </div>
          <time id="updated-at">아직 갱신되지 않음</time>
        </div>

        <div class="table-wrap">
          <table>
            <caption>엣지 에이전트 상태 및 시스템 사용량</caption>
            <thead>
              <tr>
                <th scope="col">Agent ID</th>
                <th scope="col">연결 상태</th>
                <th scope="col">마지막 Heartbeat</th>
                <th scope="col">CPU</th>
                <th scope="col">Memory</th>
                <th scope="col">Disk</th>
                <th scope="col">Disk 상태</th>
                <th scope="col">명령 상태</th>
                <th scope="col">원격 제어</th>
              </tr>
            </thead>
            <tbody id="agent-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
